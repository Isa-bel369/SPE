project_id = "jjscvssnmvqqdvyicare"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/admin/accept-invite",
  "http://localhost:5173/admin/reset-password",
]
jwt_expiry = 3600
enable_signup = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.email]
enable_signup = true

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[functions.register_member]
verify_jwt = false
[functions.verify_email]
verify_jwt = false
[functions.resend_code]
verify_jwt = false
[functions.merit_lookup]
verify_jwt = false
[functions.start_check_in]
verify_jwt = false
[functions.check_in]
verify_jwt = false
[functions.submit_contact]
verify_jwt = false
[functions.send_contact_notification]
verify_jwt = false
